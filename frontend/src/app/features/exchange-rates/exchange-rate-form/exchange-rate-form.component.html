<form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2>{{ isEdit() ? 'Editar tipo de cambio' : 'Nuevo tipo de cambio' }}</h2>

  <div class="row">
    <div class="field">
      <label for="sourceCurrency">Moneda origen</label>
      <input id="sourceCurrency" formControlName="sourceCurrency" maxlength="3" placeholder="USD" class="uppercase" />
      @if (hasError('sourceCurrency')) {
        <small class="field__error">Código de 3 letras, ej: USD.</small>
      }
    </div>

    <div class="field">
      <label for="targetCurrency">Moneda destino</label>
      <input id="targetCurrency" formControlName="targetCurrency" maxlength="3" placeholder="PEN" class="uppercase" />
      @if (hasError('targetCurrency')) {
        <small class="field__error">Código de 3 letras, ej: PEN.</small>
      }
    </div>

    <div class="field">
      <label for="rate">Tipo de cambio</label>
      <input id="rate" type="number" step="0.000001" min="0" formControlName="rate" />
      @if (hasError('rate')) {
        <small class="field__error">Debe ser mayor a 0.</small>
      }
    </div>
  </div>

  @if (!isEdit()) {
    <label class="checkbox">
      <input type="checkbox" formControlName="createInverse" />
      Crear también el tipo de cambio inverso (en la misma transacción)
    </label>
  }

  <div class="actions">
    <button type="button" class="btn btn--ghost" (click)="cancel.emit()" [disabled]="saving()">Cancelar</button>
    <button type="submit" class="btn btn--primary" [disabled]="saving()">
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
