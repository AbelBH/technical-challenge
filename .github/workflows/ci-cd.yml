# Pipeline CI/CD
#  - CI (en cada push y pull request a main): compila, revisa formato, ejecuta pruebas
#    y levanta todo con Docker Compose para correr la colección Postman (pruebas end-to-end).
#  - CD (solo al hacer push/merge a main): publica las imágenes Docker en GitHub Container Registry.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Si llega un nuevo push a la misma rama, cancela la ejecución anterior (ahorra minutos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: por defecto el token solo puede leer el repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI: backend
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/src/**/*.csproj

      - name: Restaurar dependencias
        run: dotnet restore CurrencyExchange.slnx

      - name: Verificar formato
        run: dotnet format CurrencyExchange.slnx --verify-no-changes --no-restore

      - name: Compilar (Release)
        run: dotnet build CurrencyExchange.slnx -c Release --no-restore

      - name: Pruebas unitarias (xUnit) + cobertura
        run: >
          dotnet test CurrencyExchange.slnx -c Release --no-build
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      # Guarda resultados y cobertura como artefacto descargable desde la ejecución (incluso si fallan).
      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults
          retention-days: 7

  # --------------------------------------------------------------- CI: frontend
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Pruebas unitarias (Vitest)
        run: npx ng test --watch=false

      - name: Build de producción
        run: npx ng build --configuration production

  # ------------------------------------------------- CI: pruebas end-to-end (Docker)
  e2e:
    name: E2E (Docker Compose + Postman)
    runs-on: ubuntu-latest
    needs: [backend, frontend] # solo si lo anterior pasó
    steps:
      - uses: actions/checkout@v5

      - name: Levantar la aplicación
        run: docker compose up --build -d

      - name: Esperar a que la API esté saludable
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health; then echo; echo "API lista"; exit 0; fi
            sleep 2
          done
          echo "La API no respondió a tiempo"; docker compose logs api; exit 1

      - name: Verificar que el front responde
        run: curl -fs -o /dev/null http://localhost:4200

      - name: Ejecutar colección Postman (Newman)
        run: >
          npx --yes newman run backend/postman/CurrencyExchange.postman_collection.json
          -e backend/postman/CurrencyExchange.Docker.postman_environment.json

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Bajar contenedores
        if: always()
        run: docker compose down

  # ------------------------------------------------ CD: publicar imágenes Docker
  publish:
    name: Publicar imágenes (GHCR)
    runs-on: ubuntu-latest
    needs: [e2e]
    # Solo en main y nunca desde un pull request.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # necesario para subir a ghcr.io
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiquetas: "latest" y el SHA del commit (trazabilidad: qué código hay en cada imagen).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/currency-exchange-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
